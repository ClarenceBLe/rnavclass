name: prnav-pipeline          # rename as you wish
channels:
  - conda-forge               # general packages
  - bioconda                  # bioinformatics CLI tools
  - defaults
dependencies:
  # ───────── core runtime ─────────
  - python = 3.11

  # ───────── python libraries imported in the scripts ─────────
  - pandas                    # DataFrame work
  - typer                     # CLI framework
  - biopython                 # Bio.SeqIO
  - rich                      # pretty console output (used implicitly by Typer)

  # ───────── external command-line tools invoked via subprocess ─────────
  # 01detection.py → checkv, genomad :contentReference[oaicite:0]{index=0}&#8203;:contentReference[oaicite:1]{index=1}
  - checkv
  - genomad

  # 02phylotree.py → hmmsearch (HMMER), mafft, trimal, iqtree :contentReference[oaicite:2]{index=2}&#8203;:contentReference[oaicite:3]{index=3}
  - hmmer                     # provides hmmsearch
  - mafft
  - trimal
  - iqtree

  # ───────── optional section for anything pip-only (none required now) ─────────
  # - pip:
  #     - some_pip_only_package
